spring:
  application:
    name: oltp-transaction-engine

  datasource:
    url: jdbc:postgresql://localhost:5432/oltp_db
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:password}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
      idle-timeout: 600000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true

transaction:
  executor:
    core-pool-size: 10
    max-pool-size: 50
    queue-capacity: 500

logging:
  level:
    com.gowtham.oltp: INFO
    org.springframework.orm: WARN
